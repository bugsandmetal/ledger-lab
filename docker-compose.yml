# Local placeholders match .env.example. They are not secrets.
name: ledger-lab

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # About 40s for a cold start: 2s start_interval, 20 retries, after a 40s start period.
    # Steady-state interval is 10s. start_interval needs Docker Engine 25+.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s
      start_interval: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  node:
    build:
      context: .
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ledger:ledger@postgres:5432/ledger}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    # Probe timeout is 4s, one second above the default database timeout of 3s,
    # so the process can answer. Docker's timeout is 5s, above the probe.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ["PORT"] + "/ready", timeout=4)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
      start_interval: 2s

volumes:
  postgres_data:
