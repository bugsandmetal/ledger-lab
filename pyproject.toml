[project]
name = "ledger-lab"
version = "0.1.0"
description = "Ledger Lab node"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
ledger-lab = "ledger_lab.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ANN", "RET", "C4", "A", "TID"]

[tool.mypy]
strict = true
python_version = "3.15"
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ledger_lab"]
# test_shutdown starts the node in a subprocess. pytest-cov 7 measures that
# process only when coverage.py's subprocess patch is enabled.
patch = ["subprocess"]

[tool.coverage.report]
# Coverage total with branch measurement, 2026-11-12, Python 3.15.2:
# 99.00% (164/166 statements, 34/34 branches). The missed statements are
# the ConnectionError handler in server.py. precision is 2 because one more
# missed statement is 98.51%, which integer rounding would show as 99.
fail_under = 99
precision = 2
show_missing = true
